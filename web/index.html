<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Monitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot" id="conn" title="Connecting…"></span>
      <h1>Agent Monitor</h1>
      <span class="sub">Live activity from Claude Code and Codex</span>
    </div>
    <div class="controls">
      <select id="agentFilter" aria-label="Filter by agent">
        <option value="all">All agents</option>
        <option value="claude-code">Claude Code</option>
        <option value="codex">Codex</option>
      </select>
      <label class="check"><input type="checkbox" id="errorsOnly" /> Errors only</label>
      <button id="clearBtn" type="button">Clear</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <main>
    <ol id="feed" class="feed"></ol>
    <p id="empty" class="empty">
      Waiting for events… Run <code>npm run samples</code> to send test data,
      or start Claude Code / Codex with the hooks installed.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
